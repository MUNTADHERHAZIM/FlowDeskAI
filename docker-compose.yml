version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowdesk_db}
      POSTGRES_USER: ${POSTGRES_USER:-flowdesk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowdesk_secret_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk_user -d flowdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowdesk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowdesk_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-flowdesk-super-secret-key-change-in-production-2026}
      - POSTGRES_DB=${POSTGRES_DB:-flowdesk_db}
      - POSTGRES_USER=${POSTGRES_USER:-flowdesk_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flowdesk_secret_password_2026}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowdesk_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-flowdesk_db}
      - POSTGRES_USER=${POSTGRES_USER:-flowdesk_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flowdesk_secret_password_2026}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowdesk_frontend
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
